<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Arena - Taktische Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 900px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: #0f172a;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            z-index: 5;
            display: none;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 8px 14px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            color: #00f3ff;
            font-size: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            padding: 30px;
            cursor: default;
        }
        .screen h1 {
            color: #00f3ff;
            font-size: 34px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        .screen p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 14px 36px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,243,255,0.4);
            pointer-events: auto;
            margin: 8px 0;
            width: 220px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .end-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .icon-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        #retry-btn { background: #10b981; color: #fff; }
        #home-btn { background: #6366f1; color: #fff; }
        #shop-screen { display: none; }
        .shop-list {
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding-right: 5px;
        }
        .shop-item {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #f8fafc; text-align: left; }
        .shop-info p { margin: 0; font-size: 12px; color: #94a3b8; text-align: left; }
        .buy-btn {
            background: #f59e0b; color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .buy-btn.equipped { background: #10b981; color: #fff; }
        .buy-btn.locked { background: #3b82f6; color: #fff; }
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 5;
            display: none;
        }
        .control-pad {
            width: 100px; height: 100px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; pointer-events: auto;
        }
        .control-knob {
            width: 44px; height: 44px; background: rgba(0, 243, 255, 0.7); border-radius: 50%; position: absolute; top: 26px; left: 26px; pointer-events: none; box-shadow: 0 0 12px #00f3ff;
        }
        #fire-btn {
            width: 90px; height: 90px; background: rgba(255, 51, 102, 0.3); border: 2px solid #ff3366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ff3366; font-weight: bold; font-size: 15px; pointer-events: auto; box-shadow: 0 0 15px rgba(255,51,102,0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div class="stat-box">Spieler übrig: <span id="remaining-players" style="color: #00f3ff;">0</span></div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <button id="pause-btn" onclick="togglePause()">⏸</button>

        <div id="start-screen" class="screen">
            <h1>BLOB ARENA</h1>
            <p>Taktische Bots, bunte Gegner & Diep.io-Maus-Aiming!<br><br>Coins: <span id="menu-coins" style="color: #f59e0b; font-weight: bold;">0</span> 🪙</p>
            <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
            <button class="btn btn-secondary" onclick="openShop()">SHOP</button>
        </div>

        <div id="shop-screen" class="screen">
            <h1>SKIN SHOP</h1>
            <p>Deine Coins: <span id="shop-coins-display" style="color: #f59e0b; font-weight: bold;">0</span> 🪙</p>
            <div class="shop-list" id="shop-items-container"></div>
            <button class="btn btn-secondary" onclick="closeShop()">ZURÜCK</button>
        </div>

        <div id="pause-screen" class="screen" style="display: none;">
            <h1>PAUSE</h1>
            <button class="btn" onclick="resumeGame()">Weiter spielen</button>
            <button class="btn btn-secondary" onclick="startGame()">Erneut Versuchen</button>
            <button class="btn btn-secondary" onclick="openOptions()">Optionen</button>
            <button class="btn btn-secondary" onclick="goHome()">Hauptmenü</button>
        </div>

        <div id="end-screen" class="screen" style="display: none;">
            <h1 id="end-title">GAME OVER</h1>
            <p id="end-message">Du wurdest besiegt!</p>
            <div class="end-buttons">
                <button class="icon-btn" id="retry-btn" onclick="startGame()" title="Retry">↺</button>
                <button class="icon-btn" id="home-btn" onclick="goHome()" title="Home">⌂</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div id="joystick-pad" class="control-pad">
                <div id="joystick-knob" class="control-knob"></div>
            </div>
            <div id="fire-btn">SCHUSS</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth > 450 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight > 900 ? 900 : window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let coins = parseInt(localStorage.getItem('blob_coins')) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem('blob_unlocked_skins')) || ['default'];
        let selectedSkin = localStorage.getItem('blob_selected_skin') || 'default';

        const skins = {
            default: { name: "Standard Blob", price: 0, color: "#00f3ff", type: "basic" },
            neon_green: { name: "Toxic Green", price: 50, color: "#10b981", type: "basic" },
            hot_pink: { name: "Laser Pink", price: 75, color: "#ec4899", type: "basic" },
            gold_royale: { name: "Gold Royale", price: 150, color: "#f59e0b", glow: "#fbbf24", type: "epic" },
            plasma_core: { name: "Plasma Core", price: 250, color: "#8b5cf6", core: "#00f3ff", type: "legendary" },
            galaxy_void: { name: "Galaxy Void", price: 400, color: "#3b82f6", secondary: "#ec4899", type: "legendary" }
        };

        const enemyColors = ["#ff3366", "#f97316", "#a855f7", "#ec4899", "#84cc16", "#06b6d4", "#eab308"];

        function updateCoinDisplay() {
            document.getElementById("menu-coins").innerText = coins;
            document.getElementById("shop-coins-display").innerText = coins;
            localStorage.setItem('blob_coins', coins);
        }
        updateCoinDisplay();

        let gameRunning = false;
        let isPaused = false;
        let kills = 0;
        const worldWidth = 900;
        const worldHeight = 1200;

        const mapsList = [
            [

            ],
            [
                {type: 'water', x: 250, y: 450, w: 100, h: 250, r: 30},
                {type: 'water', x: 550, y: 450, w: 100, h: 250, r: 30},

            ],
            [
                {type: 'wall', x: 200, y: 600, w: 500, h: 20},
                {type: 'water', x: 380, y: 250, w: 140, h: 100, r: 25},
                {type: 'water', x: 380, y: 850, w: 140, h: 100, r: 25}
            ],
            [
                {type: 'water', x: 150, y: 300, w: 130, h: 130, r: 30},
                {type: 'water', x: 620, y: 750, w: 130, h: 130, r: 30},

            ],
            [
                {type: 'wall', x: 250, y: 300, w: 400, h: 20},

            ],
            [

            ],
            [

            ],
            [
                {type: 'wall', x: 150, y: 400, w: 250, h: 20},

            ],
            [
                {type: 'water', x: 220, y: 250, w: 110, h: 110, r: 25},

                {type: 'water', x: 390, y: 840, w: 120, h: 120, r: 30},

            ],
            [
                {type: 'wall', x: 440, y: 250, w: 20, h: 700},
                {type: 'water', x: 200, y: 530, w: 120, h: 140, r: 30},
                {type: 'water', x: 580, y: 530, w: 120, h: 140, r: 30}
            ],
            [
                {type: 'water', x: 250, y: 380, w: 130, h: 130, r: 35},
                {type: 'water', x: 520, y: 690, w: 130, h: 130, r: 35},
                {type: 'wall', x: 200, y: 750, w: 200, h: 20},
                {type: 'wall', x: 500, y: 430, w: 200, h: 20}
            ],
            [
                {type: 'wall', x: 250, y: 300, w: 20, h: 600},
                {type: 'wall', x: 630, y: 300, w: 20, h: 600},
                {type: 'water', x: 385, y: 525, w: 130, h: 150, r: 35}
            ],
            [
                {type: 'water', x: 200, y: 300, w: 100, h: 100, r: 25},
                {type: 'water', x: 600, y: 300, w: 100, h: 100, r: 25},
                {type: 'water', x: 200, y: 800, w: 100, h: 100, r: 25},
                {type: 'water', x: 600, y: 800, w: 100, h: 100, r: 25},
                {type: 'wall', x: 320, y: 550, w: 260, h: 20}
            ]
        ];

        let currentMap = [];

        let player = {
            x: worldWidth / 2,
            y: worldHeight / 2,
            radius: 20,
            hp: 10,
            maxHp: 10,
            speed: 4,
            vx: 0,
            vy: 0,
            angle: 0,
            shootCooldown: 0,
            maxCooldown: 35
        };

        let bullets = [];
        let enemies = [];
        let floatTexts = [];
        let particles = [];

        let mouse = { x: 0, y: 0, down: false };
        let joystick = { active: false, x: 0, y: 0, dx: 0, dy: 0, maxDist: 38 };
        let keys = {};

        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // PC Maus-Steuerung (Diep.io Style)
        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", e => {
            if (!gameRunning || isPaused) return;
            mouse.down = true;
            shootPlayerBullet();
        });

        window.addEventListener("mouseup", () => {
            mouse.down = false;
        });

        // Mobile Touch Joystick
        const pad = document.getElementById("joystick-pad");
        const knob = document.getElementById("joystick-knob");
        const fireBtn = document.getElementById("fire-btn");

        pad.addEventListener("touchstart", e => {
            if (isPaused) return;
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            joystick.active = true;
        }, {passive: false});

        pad.addEventListener("touchmove", e => {
            if (isPaused) return;
            e.preventDefault();
            if (joystick.active) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        pad.addEventListener("touchend", e => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        function updateJoystick(clientX, clientY) {
            let pullX = clientX - joystick.x;
            let pullY = clientY - joystick.y;
            let dist = Math.hypot(pullX, pullY);
            if (dist > joystick.maxDist) {
                pullX = (pullX / dist) * joystick.maxDist;
                pullY = (pullY / dist) * joystick.maxDist;
            }
            knob.style.transform = `translate(${pullX}px, ${pullY}px)`;
            joystick.dx = pullX / joystick.maxDist;
            joystick.dy = pullY / joystick.maxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            knob.style.transform = `translate(0px, 0px)`;
        }

        fireBtn.addEventListener("touchstart", e => {
            if (isPaused) return;
            e.preventDefault();
            shootPlayerBullet();
        }, {passive: false});

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                document.getElementById("pause-screen").style.display = "flex";
                document.getElementById("mobile-controls").style.display = "none";
                document.getElementById("pause-btn").style.display = "none";
            } else {
                document.getElementById("pause-screen").style.display = "none";
                document.getElementById("mobile-controls").style.display = "flex";
                document.getElementById("pause-btn").style.display = "flex";
                requestAnimationFrame(gameLoop);
            }
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById("pause-screen").style.display = "none";
            document.getElementById("mobile-controls").style.display = "flex";
            document.getElementById("pause-btn").style.display = "flex";
            requestAnimationFrame(gameLoop);
        }

        function openOptions() { alert("Optionen folgen bald!"); }

        function openShop() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("shop-screen").style.display = "flex";
            renderShop();
        }

        function closeShop() {
            document.getElementById("shop-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            updateCoinDisplay();
        }

        function renderShop() {
            const container = document.getElementById("shop-items-container");
            container.innerHTML = "";
            for (let id in skins) {
                let skin = skins[id];
                let isUnlocked = unlockedSkins.includes(id);
                let isEquipped = selectedSkin === id;
                let btnHTML = isEquipped ? `<button class="buy-btn equipped">Ausgerüstet</button>` :
                            isUnlocked ? `<button class="buy-btn locked" onclick="selectSkin('${id}')">Auswählen</button>` :
                            `<button class="buy-btn" onclick="buySkin('${id}')">${skin.price} 🪙</button>`;
                container.innerHTML += `
                    <div class="shop-item">
                        <div class="shop-info"><h3>${skin.name}</h3><p>${skin.price === 0 ? 'Standard Skin' : skin.price + ' Coins'}</p></div>
                        ${btnHTML}
                    </div>
                `;
            }
        }

        function buySkin(id) {
            let skin = skins[id];
            if (coins >= skin.price) {
                coins -= skin.price;
                unlockedSkins.push(id);
                selectedSkin = id;
                localStorage.setItem('blob_unlocked_skins', JSON.stringify(unlockedSkins));
                localStorage.setItem('blob_selected_skin', selectedSkin);
                updateCoinDisplay();
                renderShop();
            } else { alert("Nicht genug Coins!"); }
        }

        function selectSkin(id) {
            selectedSkin = id;
            localStorage.setItem('blob_selected_skin', selectedSkin);
            renderShop();
        }

        function goHome() {
            gameRunning = false;
            isPaused = false;
            document.getElementById("end-screen").style.display = "none";
            document.getElementById("pause-screen").style.display = "none";
            document.getElementById("ui-overlay").style.display = "none";
            document.getElementById("mobile-controls").style.display = "none";
            document.getElementById("pause-btn").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            updateCoinDisplay();
        }

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("shop-screen").style.display = "none";
            document.getElementById("end-screen").style.display = "none";
            document.getElementById("pause-screen").style.display = "none";
            document.getElementById("ui-overlay").style.display = "flex";
            document.getElementById("mobile-controls").style.display = "flex";
            document.getElementById("pause-btn").style.display = "flex";

            const randomIndex = Math.floor(Math.random() * mapsList.length);
            currentMap = mapsList[randomIndex];

            player.x = worldWidth / 2;
            player.y = worldHeight / 2;
            while (checkCollisionWithObstacles(player.x, player.y, player.radius)) {
                player.x = Math.random() * (worldWidth - 200) + 100;
                player.y = Math.random() * (worldHeight - 200) + 100;
            }

            player.hp = 10;
            player.vx = 0;
            player.vy = 0;
            player.shootCooldown = 0;
            kills = 0;
            bullets = [];
            enemies = [];
            floatTexts = [];
            particles = [];
            isPaused = false;
            document.getElementById("kill-count").innerText = kills;

            for (let i = 0; i < 15; i++) spawnEnemy();

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            let ex, ey, safe = false, attempts = 0;
            do {
                ex = Math.random() * (worldWidth - 80) + 40;
                ey = Math.random() * (worldHeight - 80) + 40;
                if (Math.hypot(ex - player.x, ey - player.y) > 250 && !checkCollisionWithObstacles(ex, ey, 20)) {
                    safe = true;
                }
                attempts++;
                if (attempts > 50) break;
            } while (!safe);

            enemies.push({
                x: ex, y: ey,
                radius: 20,
                hp: 10, maxHp: 10,
                speed: 3.2 + Math.random() * 1.3, // Bots sind jetzt deutlich schneller (3.2 bis 4.5)
                preferredDist: 60 + Math.random() * 100,
                strafeDir: Math.random() < 0.5 ? 1 : -1,
                shootCooldown: Math.random() * 60 + 30,
                wanderAngle: Math.random() * Math.PI * 2,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)]
            });
        }

        function checkCollisionWithObstacles(x, y, radius) {
            for (let obs of currentMap) {
                let closestX = Math.max(obs.x, Math.min(x, obs.x + obs.w));
                let closestY = Math.max(obs.y, Math.min(y, obs.y + obs.h));
                let distX = x - closestX;
                let distY = y - closestY;
                if ((distX * distX + distY * distY) < (radius * radius)) {
                    return true;
                }
            }
            return false;
        }

        // Taktische Sichtlinienprüfung für Bots
        function hasLineOfSight(x1, y1, x2, y2) {
            let steps = 12;
            for (let s = 1; s <= steps; s++) {
                let t = s / steps;
                let cx = x1 + (x2 - x1) * t;
                let cy = y1 + (y2 - y1) * t;
                if (checkCollisionWithObstacles(cx, cy, 5)) {
                    return false;
                }
            }
            return true;
        }

        function moveWithCollision(entity, dx, dy) {
            entity.x += dx;
            if (checkCollisionWithObstacles(entity.x, entity.y, entity.radius)) { entity.x -= dx; }
            entity.y += dy;
            if (checkCollisionWithObstacles(entity.x, entity.y, entity.radius)) { entity.y -= dy; }
        }

        function lerpAngle(current, target, factor) {
            let diff = target - current;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return current + diff * factor;
        }

        function shootPlayerBullet() {
            if (!gameRunning || isPaused) return;
            if (player.shootCooldown > 0) return;

            player.shootCooldown = player.maxCooldown;
            let angle = player.angle;
            bullets.push({
                x: player.x, y: player.y,
                dx: Math.cos(angle) * 8, dy: Math.sin(angle) * 8,
                radius: 6, color: "#00f3ff",
                fromPlayer: true, shooterIndex: -1
            });
        }

        function addFloatText(text, x, y, color = "#ff4444") {
            floatTexts.push({ text: text, x: x, y: y, alpha: 1.0, color: color, vy: -1.2 });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1, color: color, alpha: 1.0
                });
            }
        }

        function gameOver(won) {
            gameRunning = false;
            isPaused = false;
            document.getElementById("ui-overlay").style.display = "none";
            document.getElementById("mobile-controls").style.display = "none";
            document.getElementById("pause-btn").style.display = "none";
            document.getElementById("end-screen").style.display = "flex";

            const title = document.getElementById("end-title");
            const msg = document.getElementById("end-message");

            if (won) {
                title.innerText = "GEWONNEN!";
                title.style.color = "#10b981";
                let earnedCoins = Math.floor(Math.random() * 11) + 10;
                coins += earnedCoins;
                updateCoinDisplay();
                msg.innerText = `Du hast alle Gegner vernichtet!\n+${earnedCoins} Coins erhalten 🪙`;
            } else {
                title.innerText = "GAME OVER";
                title.style.color = "#ff3366";
                msg.innerText = `Du hast ${kills} Gegner besiegt!`;
            }
        }

        function update() {
            if (!gameRunning || isPaused) return;

            document.getElementById("remaining-players").innerText = enemies.length + 1;

            if (player.shootCooldown > 0) player.shootCooldown--;

            // Ziel-Winkel für das Aiming bestimmen
            let targetAngle = player.angle;
            if (mouse.down) {
                targetAngle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
                shootPlayerBullet();
            }

            let moveX = joystick.dx;
            let moveY = joystick.dy;

            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            // Ziel-Geschwindigkeit berechnen
            let targetVx = moveX * player.speed;
            let targetVy = moveY * player.speed;

            // Trägheit einbauen
            player.vx += (targetVx - player.vx) * 0.2;
            player.vy += (targetVy - player.vy) * 0.2;

            if (Math.abs(player.vx) > 0.01 || Math.abs(player.vy) > 0.01) {
                if (!mouse.down && (moveX !== 0 || moveY !== 0)) {
                    targetAngle = Math.atan2(moveY, moveX);
                }
                moveWithCollision(player, player.vx, player.vy);
            }

            // Winkel weich hinterherziehen
            player.angle = lerpAngle(player.angle, targetAngle, 0.2);

            player.x = Math.max(player.radius, Math.min(worldWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(worldHeight - player.radius, player.y));

            // Kugeln aktualisieren
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx; b.y += b.dy;

                if (b.x < 0 || b.x > worldWidth || b.y < 0 || b.y > worldHeight || checkCollisionWithObstacles(b.x, b.y, b.radius)) {
                    createParticles(b.x, b.y, b.color);
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.fromPlayer) {
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (Math.hypot(b.x - en.x, b.y - en.y) < b.radius + en.radius) {
                            en.hp -= 1;
                            hit = true;
                            createParticles(en.x, en.y, "#ff3366");
                            addFloatText("-1 HP", en.x, en.y - 20, "#00f3ff");

                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                kills++;
                                document.getElementById("kill-count").innerText = kills;
                                if (enemies.length === 0) gameOver(true);
                            }
                            break;
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                } else {
                    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                        player.hp -= 1;
                        createParticles(player.x, player.y, "#00f3ff");
                        addFloatText("-1 HP", player.x, player.y - 20, "#ff3366");
                        bullets.splice(i, 1);
                        if (player.hp <= 0) gameOver(false);
                        continue;
                    }

                    let botHit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (b.shooterIndex === j) continue;
                        let en = enemies[j];
                        if (Math.hypot(b.x - en.x, b.y - en.y) < b.radius + en.radius) {
                            en.hp -= 1;
                            botHit = true;
                            createParticles(en.x, en.y, "#ff3366");
                            addFloatText("-1 HP", en.x, en.y - 20, "#ff00ff");
                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                if (enemies.length === 0) gameOver(true);
                            }
                            break;
                        }
                    }
                    if (botHit) { bullets.splice(i, 1); continue; }
                }
            }

            // Taktische Gegner-KI
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                let targetX = player.x;
                let targetY = player.y;
                let distToPlayer = Math.hypot(player.x - en.x, player.y - en.y);
                let closestDist = distToPlayer;
                let targetIsPlayer = true;

                for (let j = 0; j < enemies.length; j++) {
                    if (i === j) continue;
                    let other = enemies[j];
                    let distToOther = Math.hypot(other.x - en.x, other.y - en.y);
                    if (distToOther < closestDist) {
                        closestDist = distToOther;
                        targetX = other.x;
                        targetY = other.y;
                        targetIsPlayer = false;
                    }
                }

                let angleToTarget = Math.atan2(targetY - en.y, targetX - en.x);
                en.wanderAngle += (Math.random() - 0.5) * 0.5;

                let hasLOS = hasLineOfSight(en.x, en.y, targetX, targetY);

                let sepX = 0, sepY = 0;
                for (let j = 0; j < enemies.length; j++) {
                    if (i === j) continue;
                    let other = enemies[j];
                    let d = Math.hypot(other.x - en.x, other.y - en.y);
                    if (d < 45 && d > 0) {
                        sepX += (en.x - other.x) / d;
                        sepY += (en.y - other.y) / d;
                    }
                }

                let moveX = 0, moveY = 0;
                if (!hasLOS) {
                    let peekAngle = angleToTarget + (Math.PI / 2) * en.strafeDir;
                    moveX = Math.cos(peekAngle) * (en.speed * 0.95);
                    moveY = Math.sin(peekAngle) * (en.speed * 0.95);
                } else {
                    if (closestDist > en.preferredDist + 20) {
                        moveX = Math.cos(angleToTarget) * en.speed; // Volle Geschwindigkeit beim Verfolgen
                        moveY = Math.sin(angleToTarget) * en.speed;
                    } else if (closestDist < en.preferredDist - 20) {
                        moveX = -Math.cos(angleToTarget) * (en.speed * 0.8);
                        moveY = -Math.sin(angleToTarget) * (en.speed * 0.8);
                    } else {
                        let strafeAngle = angleToTarget + (Math.PI / 2) * en.strafeDir;
                        moveX = Math.cos(strafeAngle) * (en.speed * 0.9);
                        moveY = Math.sin(strafeAngle) * (en.speed * 0.9);
                    }
                }

                let finalMoveX = moveX + sepX * 1.8 + Math.cos(en.wanderAngle) * 0.5;
                let finalMoveY = moveY + sepY * 1.8 + Math.sin(en.wanderAngle) * 0.5;

                moveWithCollision(en, finalMoveX, finalMoveY);

                en.x = Math.max(en.radius, Math.min(worldWidth - en.radius, en.x));
                en.y = Math.max(en.radius, Math.min(worldHeight - en.radius, en.y));

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = Math.random() * 60 + 30;
                    if (hasLOS) {
                        let shootAngle = angleToTarget + (Math.random() - 0.5) * 0.3;
                        bullets.push({
                            x: en.x, y: en.y,
                            dx: Math.cos(shootAngle) * 4.5, dy: Math.sin(shootAngle) * 4.5,
                            radius: 6, color: targetIsPlayer ? "#ff9900" : "#ff00ff",
                            fromPlayer: false, shooterIndex: i
                        });
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.y += ft.vy; ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let camX = canvas.width / 2 - player.x;
            let camY = canvas.height / 2 - player.y;
            ctx.translate(camX, camY);

            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x <= worldWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, worldHeight); ctx.stroke();
            }
            for (let y = 0; y <= worldHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(worldWidth, y); ctx.stroke();
            }

            for (let obs of currentMap) {
                ctx.save();
                if (obs.type === 'water') {
                    ctx.shadowBlur = 15; ctx.shadowColor = "#00f3ff";
                    ctx.fillStyle = "rgba(14, 116, 144, 0.65)";
                    ctx.strokeStyle = "#00f3ff"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.w, obs.h, obs.r || 20); ctx.fill(); ctx.stroke();
                } else {
                    ctx.shadowBlur = 12; ctx.shadowColor = "#3b82f6";
                    ctx.fillStyle = "#1e293b";
                    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 8); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            }

            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, worldWidth, worldHeight);

            for (let en of enemies) {
                ctx.save();
                ctx.shadowBlur = 12; ctx.shadowColor = en.color;
                ctx.fillStyle = en.color;
                ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.beginPath(); ctx.arc(en.x - 5, en.y - 5, 5, 0, Math.PI * 2); ctx.fill();
                drawHealthBar(en.x, en.y - en.radius - 12, en.hp, en.maxHp);
            }

            drawPlayerSkin();
            drawHealthBar(player.x, player.y - player.radius - 12, player.hp, player.maxHp);

            for (let b of bullets) {
                ctx.save();
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            for (let p of particles) {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            for (let ft of floatTexts) {
                ctx.save();
                ctx.font = "bold 16px sans-serif"; ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha; ctx.shadowBlur = 4; ctx.shadowColor = "#000";
                ctx.fillText(ft.text, ft.x - 15, ft.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawPlayerSkin() {
            let skin = skins[selectedSkin] || skins['default'];
            ctx.save();

            if (selectedSkin === 'gold_royale') {
                ctx.shadowBlur = 18; ctx.shadowColor = "#fbbf24";
                ctx.fillStyle = skin.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2); ctx.stroke();
            } else if (selectedSkin === 'plasma_core') {
                ctx.shadowBlur = 18; ctx.shadowColor = skin.color;
                ctx.fillStyle = skin.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = skin.core;
                ctx.beginPath(); ctx.arc(player.x, player.y, 8, 0, Math.PI * 2); ctx.fill();
            } else if (selectedSkin === 'galaxy_void') {
                ctx.shadowBlur = 20; ctx.shadowColor = skin.color;
                ctx.fillStyle = skin.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = skin.secondary; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius - 4, 0, Math.PI * 2); ctx.stroke();
            } else {
                ctx.shadowBlur = 15; ctx.shadowColor = skin.color;
                ctx.fillStyle = skin.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();

            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.arc(player.x - 6, player.y - 6, 6, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(player.angle) * 24, player.y + Math.sin(player.angle) * 24);
            ctx.stroke();
        }

        function drawHealthBar(x, y, current, max) {
            const barWidth = 40; const barHeight = 6;
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(x - barWidth / 2, y, barWidth, barHeight);
            const healthWidth = (current / max) * barWidth;
            ctx.fillStyle = current > 3 ? "#10b981" : "#ef4444";
            ctx.fillRect(x - barWidth / 2, y, healthWidth, barHeight);
        }

        function gameLoop() {
            if (!gameRunning) return;
            if (!isPaused) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
