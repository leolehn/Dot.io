<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Arena - Final Fixed Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 900px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
        }
        /* Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #gameCanvas { z-index: 1; }
        #menuBgCanvas { z-index: 2; pointer-events: none; }

        /* Fade Overlay */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            z-index: 100;
        }

        /* HUD / Ingame UI */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 8px 14px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            color: #00f3ff;
            font-size: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 15;
            padding: 30px 20px;
        }
        #start-screen {
            background: transparent; /* Lässt den animierten Canvas-Hintergrund durchscheinen */
        }
        .menu-content {
            position: relative;
            z-index: 16;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .screen h1 {
            color: #00f3ff;
            font-size: 32px;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(0,243,255,0.6);
            letter-spacing: 2px;
        }

        /* Blob Showcase Box */
        .blob-showcase-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 5px 0;
        }
        .arrow-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .arrow-btn:active {
            transform: scale(0.9);
            background: #00f3ff;
            color: #000;
        }
        .preview-circle {
            width: 130px;
            height: 130px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.8);
        }
        #menuPreviewCanvas {
            width: 110px;
            height: 110px;
        }

        /* Class Description Card */
        .class-desc-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 10px 16px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .class-desc-card h3 {
            margin: 0 0 3px 0;
            color: #f8fafc;
            font-size: 17px;
        }
        .class-desc-card p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.3;
        }

        /* Buttons & Bottom Area */
        .menu-bottom-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(0,243,255,0.4);
            width: 250px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 190px;
            padding: 10px 20px;
            font-size: 14px;
        }

        /* Shop, Pause, End Screens */
        .other-screen {
            background: rgba(11, 15, 25, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            padding: 25px;
        }
        .shop-list {
            width: 100%;
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        .shop-item {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-info h3 { margin: 0 0 4px 0; font-size: 15px; color: #f8fafc; text-align: left; }
        .shop-info p { margin: 0; font-size: 11px; color: #94a3b8; text-align: left; }
        .buy-btn {
            background: #f59e0b; color: #000; border: none; padding: 8px 14px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .buy-btn.equipped { background: #10b981; color: #fff; }
        .buy-btn.locked { background: #3b82f6; color: #fff; }

        .end-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .icon-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #retry-btn { background: #10b981; color: #fff; }
        #home-btn { background: #6366f1; color: #fff; }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 20;
            display: none;
        }
        .control-pad {
            width: 100px; height: 100px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; pointer-events: auto;
        }
        .control-knob {
            width: 44px; height: 44px; background: rgba(0, 243, 255, 0.7); border-radius: 50%; position: absolute; top: 26px; left: 26px; pointer-events: none; box-shadow: 0 0 12px #00f3ff;
        }
        #fire-btn {
            width: 90px; height: 90px; background: rgba(255, 51, 102, 0.3); border: 2px solid #ff3366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ff3366; font-weight: bold; font-size: 15px; pointer-events: auto; box-shadow: 0 0 15px rgba(255,51,102,0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Fade Overlay für sanfte Übergänge -->
        <div id="fade-overlay"></div>

        <!-- Ingame UI HUD -->
        <div id="ui-overlay">
            <div class="stat-box">Spieler übrig: <span id="remaining-players" style="color: #00f3ff;">0</span></div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <button id="pause-btn" onclick="togglePause()">⏸</button>

        <!-- Hintergrund-Canvas für das animierte Menü -->
        <canvas id="menuBgCanvas"></canvas>

        <!-- HAUPTMENÜ -->
        <div id="start-screen" class="screen">
            <div class="menu-content">
                <h1>BLOB ARENA</h1>

                <!-- Große Blob-Vorschau mit Pfeilen -->
                <div class="blob-showcase-box">
                    <button class="arrow-btn" onclick="changeClass(-1)">◀</button>
                    <div class="preview-circle">
                        <canvas id="menuPreviewCanvas" width="110" height="110"></canvas>
                    </div>
                    <button class="arrow-btn" onclick="changeClass(1)">▶</button>
                </div>

                <!-- Klassen-Beschreibung -->
                <div class="class-desc-card">
                    <h3 id="menu-class-name">Standard Blob</h3>
                    <p id="menu-class-desc">Ausgewogener Allrounder.</p>
                    <p id="menu-class-status" style="margin-top: 5px; font-weight: bold; color: #10b981;"></p>
                </div>

                <!-- Unterer Bereich mit Stats & Buttons -->
                <div class="menu-bottom-area">
                    <div style="font-size: 12px; color: #94a3b8; background: rgba(15,23,42,0.85); padding: 5px 10px; border-radius: 8px; border: 1px solid #334155;">
                        Level <span id="player-level" style="color: #00f3ff; font-weight: bold;">1</span> | XP: <span id="player-xp">0</span> / <span id="player-next-xp">500</span> | Coins: <span id="menu-coins" style="color: #f59e0b; font-weight: bold;">0</span> 🪙
                    </div>
                    <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
                    <button class="btn btn-secondary" onclick="openShop()">SKIN SHOP</button>
                </div>
            </div>
        </div>

        <!-- SKIN SHOP -->
        <div id="shop-screen" class="screen other-screen" style="display: none;">
            <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; height: 100%; justify-content: space-between; padding: 10px 0;">
                <div>
                    <h1>SKIN SHOP</h1>
                    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 12px;">Wähle die Farbe deines Blobs (Accessoires bleiben unverändert)</p>
                    <p>Deine Coins: <span id="shop-coins-display" style="color: #f59e0b; font-weight: bold;">0</span> 🪙</p>
                    <div class="shop-list" id="shop-items-container"></div>
                </div>
                <div style="display: flex; justify-content: center;">
                    <button class="btn btn-secondary" onclick="closeShop()">ZURÜCK</button>
                </div>
            </div>
        </div>

        <!-- PAUSE MENÜ -->
        <div id="pause-screen" class="screen other-screen" style="display: none;">
            <h1>PAUSE</h1>
            <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 250px;">
                <button class="btn" onclick="resumeGame()">Weiter spielen</button>
                <button class="btn btn-secondary" onclick="startGame()">Erneut Versuchen</button>
                <button class="btn btn-secondary" onclick="goHome()">Hauptmenü</button>
            </div>
        </div>

        <!-- GAME OVER / GEWONNEN -->
        <div id="end-screen" class="screen other-screen" style="display: none;">
            <h1 id="end-title">GAME OVER</h1>
            <p id="end-message" style="font-size: 14px; margin: 15px 0; color: #94a3b8;"></p>
            <div class="end-buttons">
                <button class="icon-btn" id="retry-btn" onclick="startGame()" title="Retry">↺</button>
                <button class="icon-btn" id="home-btn" onclick="goHome()" title="Home">⌂</button>
            </div>
        </div>

        <!-- Ingame Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls">
            <div id="joystick-pad" class="control-pad">
                <div id="joystick-knob" class="control-knob"></div>
            </div>
            <div id="fire-btn">SCHUSS</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const previewCanvas = document.getElementById("menuPreviewCanvas");
        const pCtx = previewCanvas.getContext("2d");

        const menuBgCanvas = document.getElementById("menuBgCanvas");
        const mCtx = menuBgCanvas.getContext("2d");
        const fadeOverlay = document.getElementById("fade-overlay");

        function resizeCanvas() {
            canvas.width = window.innerWidth > 450 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight > 900 ? 900 : window.innerHeight;
            menuBgCanvas.width = canvas.width;
            menuBgCanvas.height = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let coins = parseInt(localStorage.getItem('blob_coins')) || 0;
        let totalXP = parseInt(localStorage.getItem('blob_xp')) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem('blob_unlocked_skins')) || ['default'];
        let selectedSkin = localStorage.getItem('blob_selected_skin') || 'default';

        const blobClasses = [
            { id: 'standard', name: "Standard Blob", level: 1, radius: 20, speed: 4, hp: 10, fireRate: 35, bulletSpeed: 12, bulletSize: 6, desc: "Ausgewogener Allrounder mit Standard-Gewehr." },
            { id: 'agile', name: "Agile MP", level: 2, radius: 17, speed: 5.5, hp: 7, fireRate: 12, bulletSpeed: 15, bulletSize: 4, desc: "Extrem schnell, feuert rasante MP-Salven." },
            { id: 'shotgun', name: "Shotgunner", level: 3, radius: 21, speed: 3.8, hp: 12, fireRate: 50, bulletSpeed: 11, bulletSize: 6, desc: "Nahkampf-Spezialist mit Schrotflinten-Salve." },
            { id: 'sniper', name: "Sniper Blob", level: 4, radius: 18, speed: 3.5, hp: 8, fireRate: 75, bulletSpeed: 20, bulletSize: 8, desc: "Hält großen Abstand und feuert Sniper-Kugeln." },
            { id: 'tank', name: "Heavy Tank", level: 5, radius: 26, speed: 2.8, hp: 20, fireRate: 65, bulletSpeed: 10, bulletSize: 11, desc: "Massiv gepanzert, langsam, schwere Artillerie." }
        ];

        let selectedClassIndex = parseInt(localStorage.getItem('blob_selected_class')) || 0;

        function getLevel(xp) {
            let lvl = 1;
            while (xp >= getXpForNextLevel(lvl)) { lvl++; }
            return lvl;
        }

        function getXpForNextLevel(lvl) {
            return Math.floor(500 * Math.pow(lvl, 2.0));
        }

        function updateMenuDisplay() {
            let currentLevel = getLevel(totalXP);
            let nextXpReq = getXpForNextLevel(currentLevel);
            let prevXpReq = currentLevel > 1 ? getXpForNextLevel(currentLevel - 1) : 0;
            
            document.getElementById("player-level").innerText = currentLevel;
            document.getElementById("player-xp").innerText = totalXP - prevXpReq;
            document.getElementById("player-next-xp").innerText = nextXpReq - prevXpReq;
            document.getElementById("menu-coins").innerText = coins;
            document.getElementById("shop-coins-display").innerText = coins;

            let cClass = blobClasses[selectedClassIndex];
            document.getElementById("menu-class-name").innerText = cClass.name;
            document.getElementById("menu-class-desc").innerText = cClass.desc;

            let statusEl = document.getElementById("menu-class-status");
            if (currentLevel >= cClass.level) {
                statusEl.innerText = "✓ FREIGESCHALTET";
                statusEl.style.color = "#10b981";
            } else {
                statusEl.innerText = `🔒 Benötigt Level ${cClass.level}`;
                statusEl.style.color = "#ef4444";
            }
        }
        updateMenuDisplay();

        function changeClass(dir) {
            selectedClassIndex = (selectedClassIndex + dir + blobClasses.length) % blobClasses.length;
            localStorage.setItem('blob_selected_class', selectedClassIndex);
            updateMenuDisplay();
        }

        const skins = {
            default: { name: "Standard Blob", price: 0, color: "#00f3ff" },
            neon_green: { name: "Toxic Green", price: 50, color: "#10b981" },
            hot_pink: { name: "Laser Pink", price: 75, color: "#ec4899" },
            gold_royale: { name: "Gold Royale", price: 150, color: "#f59e0b" },
            plasma_core: { name: "Plasma Core", price: 250, color: "#8b5cf6" },
            galaxy_void: { name: "Galaxy Void", price: 400, color: "#3b82f6" }
        };

        const enemyColors = ["#ff3366", "#f97316", "#a855f7", "#ec4899", "#84cc16", "#06b6d4", "#eab308"];

        let gameRunning = false;
        let isPaused = false;
        let kills = 0;
        const worldWidth = 900;
        const worldHeight = 1200;

        const mapsList = [
            [
                {type: 'water', x: 250, y: 300, w: 120, h: 120, r: 25},
                {type: 'water', x: 530, y: 750, w: 120, h: 120, r: 25},
                {type: 'wall', x: 150, y: 550, w: 250, h: 20},
                {type: 'wall', x: 500, y: 350, w: 20, h: 250}
            ],
            [
                {type: 'water', x: 380, y: 520, w: 140, h: 140, r: 30},
                {type: 'wall', x: 200, y: 250, w: 20, h: 300},
                {type: 'wall', x: 680, y: 650, w: 20, h: 300},
                {type: 'water', x: 150, y: 850, w: 100, h: 100, r: 20},
                {type: 'water', x: 650, y: 200, w: 100, h: 100, r: 20}
            ]
        ];

        let currentMap = [];
        let player = {
            x: worldWidth / 2, y: worldHeight / 2,
            vx: 0, vy: 0, radius: 20,
            hp: 10, maxHp: 10, speed: 4,
            angle: 0, shootCooldown: 0, maxCooldown: 35,
            classConfig: blobClasses[0]
        };

        let bullets = [];
        let enemies = [];
        let floatTexts = [];
        let particles = [];
        let mouse = { x: 0, y: 0, down: false };
        let joystick = { active: false, x: 0, y: 0, dx: 0, dy: 0, maxDist: 38 };
        let keys = {};

        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            if (gameRunning && !isPaused) {
                player.angle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
            }
        });

        canvas.addEventListener("mousedown", e => {
            if (!gameRunning || isPaused) return;
            mouse.down = true;
            shootPlayerBullet();
        });
        window.addEventListener("mouseup", () => { mouse.down = false; });

        const pad = document.getElementById("joystick-pad");
        const knob = document.getElementById("joystick-knob");
        const fireBtn = document.getElementById("fire-btn");

        pad.addEventListener("touchstart", e => {
            if (isPaused) return;
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            joystick.active = true;
        }, {passive: false});

        pad.addEventListener("touchmove", e => {
            if (isPaused) return;
            e.preventDefault();
            if (joystick.active) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        pad.addEventListener("touchend", e => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        function updateJoystick(clientX, clientY) {
            let pullX = clientX - joystick.x;
            let pullY = clientY - joystick.y;
            let dist = Math.hypot(pullX, pullY);
            if (dist > joystick.maxDist) {
                pullX = (pullX / dist) * joystick.maxDist;
                pullY = (pullY / dist) * joystick.maxDist;
            }
            knob.style.transform = `translate(${pullX}px, ${pullY}px)`;
            joystick.dx = pullX / joystick.maxDist;
            joystick.dy = pullY / joystick.maxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            knob.style.transform = `translate(0px, 0px)`;
        }

        fireBtn.addEventListener("touchstart", e => {
            if (isPaused) return;
            e.preventDefault();
            shootPlayerBullet();
        }, {passive: false});

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                document.getElementById("pause-screen").style.display = "flex";
                document.getElementById("mobile-controls").style.display = "none";
                document.getElementById("pause-btn").style.display = "none";
            } else {
                document.getElementById("pause-screen").style.display = "none";
                document.getElementById("mobile-controls").style.display = "flex";
                document.getElementById("pause-btn").style.display = "flex";
                requestAnimationFrame(gameLoop);
            }
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById("pause-screen").style.display = "none";
            document.getElementById("mobile-controls").style.display = "flex";
            document.getElementById("pause-btn").style.display = "flex";
            requestAnimationFrame(gameLoop);
        }

        function openShop() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("shop-screen").style.display = "flex";
            renderShop();
        }

        function closeShop() {
            document.getElementById("shop-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            updateMenuDisplay();
        }

        function renderShop() {
            const container = document.getElementById("shop-items-container");
            container.innerHTML = "";
            for (let id in skins) {
                let skin = skins[id];
                let isUnlocked = unlockedSkins.includes(id);
                let isEquipped = selectedSkin === id;
                let btnHTML = isEquipped ? `<button class="buy-btn equipped">Ausgerüstet</button>` :
                              isUnlocked ? `<button class="buy-btn locked" onclick="selectSkin('${id}')">Auswählen</button>` :
                              `<button class="buy-btn" onclick="buySkin('${id}')">${skin.price} 🪙</button>`;
                container.innerHTML += `
                    <div class="shop-item">
                        <div class="shop-info"><h3>${skin.name}</h3><p>${skin.price === 0 ? 'Standard Skin' : skin.price + ' Coins'}</p></div>
                        ${btnHTML}
                    </div>
                `;
            }
        }

        function buySkin(id) {
            let skin = skins[id];
            if (coins >= skin.price) {
                coins -= skin.price;
                unlockedSkins.push(id);
                selectedSkin = id;
                localStorage.setItem('blob_unlocked_skins', JSON.stringify(unlockedSkins));
                localStorage.setItem('blob_selected_skin', selectedSkin);
                updateMenuDisplay();
                renderShop();
            } else { alert("Nicht genug Coins!"); }
        }

        function selectSkin(id) {
            selectedSkin = id;
            localStorage.setItem('blob_selected_skin', selectedSkin);
            renderShop();
        }

        function startGame() {
            let chosenClass = blobClasses[selectedClassIndex];
            let currentLevel = getLevel(totalXP);

            if (currentLevel < chosenClass.level) {
                alert(`Du musst erst Level ${chosenClass.level} erreichen, um diese Klasse zu spielen!`);
                return;
            }

            fadeOverlay.style.opacity = "1";
            setTimeout(() => {
                document.getElementById("start-screen").style.display = "none";
                document.getElementById("shop-screen").style.display = "none";
                document.getElementById("end-screen").style.display = "none";
                document.getElementById("pause-screen").style.display = "none";
                document.getElementById("ui-overlay").style.display = "flex";
                document.getElementById("mobile-controls").style.display = "flex";
                document.getElementById("pause-btn").style.display = "flex";

                currentMap = mapsList[Math.floor(Math.random() * mapsList.length)];

                player.classConfig = chosenClass;
                player.radius = chosenClass.radius;
                player.speed = chosenClass.speed;
                player.hp = chosenClass.hp;
                player.maxHp = chosenClass.hp;
                player.maxCooldown = chosenClass.fireRate;
                player.shootCooldown = 0;
                player.vx = 0;
                player.vy = 0;

                player.x = worldWidth / 2;
                player.y = worldHeight / 2;
                while (checkCollisionWithObstacles(player.x, player.y, player.radius)) {
                    player.x = Math.random() * (worldWidth - 200) + 100;
                    player.y = Math.random() * (worldHeight - 200) + 100;
                }

                kills = 0;
                bullets = [];
                enemies = [];
                floatTexts = [];
                particles = [];
                isPaused = false;
                document.getElementById("kill-count").innerText = kills;

                for (let i = 0; i < 15; i++) spawnEnemy();

                gameRunning = true;
                requestAnimationFrame(gameLoop);

                setTimeout(() => { fadeOverlay.style.opacity = "0"; }, 50);
            }, 200);
        }

        function goHome() {
            fadeOverlay.style.opacity = "1";
            setTimeout(() => {
                gameRunning = false;
                isPaused = false;
                document.getElementById("end-screen").style.display = "none";
                document.getElementById("pause-screen").style.display = "none";
                document.getElementById("ui-overlay").style.display = "none";
                document.getElementById("mobile-controls").style.display = "none";
                document.getElementById("pause-btn").style.display = "none";
                document.getElementById("start-screen").style.display = "flex";
                updateMenuDisplay();

                setTimeout(() => { fadeOverlay.style.opacity = "0"; }, 50);
            }, 200);
        }

        function spawnEnemy() {
            let ex, ey, safe = false, attempts = 0;
            do {
                ex = Math.random() * (worldWidth - 80) + 40;
                ey = Math.random() * (worldHeight - 80) + 40;
                if (Math.hypot(ex - player.x, ey - player.y) > 250 && !checkCollisionWithObstacles(ex, ey, 20)) {
                    safe = true;
                }
                attempts++;
                if (attempts > 50) break;
            } while (!safe);

            let eConfig = blobClasses[Math.floor(Math.random() * blobClasses.length)];
            enemies.push({
                x: ex, y: ey,
                radius: eConfig.radius,
                hp: eConfig.hp, maxHp: eConfig.hp,
                speed: eConfig.speed,
                preferredDist: eConfig.id === 'sniper' ? 180 : (eConfig.id === 'shotgun' ? 50 : 90),
                strafeDir: Math.random() < 0.5 ? 1 : -1,
                shootCooldown: Math.random() * 60 + 30,
                wanderAngle: Math.random() * Math.PI * 2,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
                classConfig: eConfig
            });
        }

        function checkCollisionWithObstacles(x, y, radius) {
            for (let obs of currentMap) {
                let closestX = Math.max(obs.x, Math.min(x, obs.x + obs.w));
                let closestY = Math.max(obs.y, Math.min(y, obs.y + obs.h));
                if (((x - closestX) ** 2 + (y - closestY) ** 2) < (radius ** 2)) return true;
            }
            return false;
        }

        function hasLineOfSight(x1, y1, x2, y2) {
            for (let s = 1; s <= 12; s++) {
                let t = s / 12;
                if (checkCollisionWithObstacles(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 5)) return false;
            }
            return true;
        }

        function moveWithCollision(entity, dx, dy) {
            entity.x += dx;
            if (checkCollisionWithObstacles(entity.x, entity.y, entity.radius)) entity.x -= dx;
            entity.y += dy;
            if (checkCollisionWithObstacles(entity.x, entity.y, entity.radius)) entity.y -= dy;
        }

        function shootPlayerBullet() {
            if (!gameRunning || isPaused || player.shootCooldown > 0) return;
            player.shootCooldown = player.maxCooldown;
            let cfg = player.classConfig;

            if (cfg.id === 'shotgun') {
                for (let spread of [-0.25, 0, 0.25]) {
                    let a = player.angle + spread;
                    bullets.push({
                        x: player.x, y: player.y,
                        dx: Math.cos(a) * cfg.bulletSpeed, dy: Math.sin(a) * cfg.bulletSpeed,
                        radius: cfg.bulletSize, color: cfg.color, fromPlayer: true, shooterIndex: -1
                    });
                }
            } else {
                bullets.push({
                    x: player.x, y: player.y,
                    dx: Math.cos(player.angle) * cfg.bulletSpeed, dy: Math.sin(player.angle) * cfg.bulletSpeed,
                    radius: cfg.bulletSize, color: cfg.color, fromPlayer: true, shooterIndex: -1
                });
            }
        }

        function addFloatText(text, x, y, color = "#ff4444") {
            floatTexts.push({ text: text, x: x, y: y, alpha: 1.0, color: color, vy: -1.2 });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1, color: color, alpha: 1.0
                });
            }
        }

        function gameOver(won) {
            gameRunning = false;
            isPaused = false;
            document.getElementById("ui-overlay").style.display = "none";
            document.getElementById("mobile-controls").style.display = "none";
            document.getElementById("pause-btn").style.display = "none";
            document.getElementById("end-screen").style.display = "flex";

            let earnedXP = (won ? 120 : 30) + (kills > 0 ? Math.floor(25 * Math.pow(kills, 1.4)) : 0);
            totalXP += earnedXP;
            localStorage.setItem('blob_xp', totalXP);

            if (won) {
                document.getElementById("end-title").innerText = "GEWONNEN!";
                document.getElementById("end-title").style.color = "#10b981";
                let earnedCoins = Math.floor(Math.random() * 11) + 10;
                coins += earnedCoins;
                updateMenuDisplay();
                document.getElementById("end-message").innerText = `Du hast alle Gegner vernichtet!\n+${earnedCoins} Coins 🪙 | +${earnedXP} XP ✨`;
            } else {
                document.getElementById("end-title").innerText = "GAME OVER";
                document.getElementById("end-title").style.color = "#ff3366";
                document.getElementById("end-message").innerText = `Du hast ${kills} Gegner besiegt!\n+${earnedXP} XP ✨ erhalten.`;
            }
        }

        function update() {
            if (!gameRunning || isPaused) return;
            document.getElementById("remaining-players").innerText = enemies.length + 1;

            if (player.shootCooldown > 0) player.shootCooldown--;
            if (mouse.down) shootPlayerBullet();

            let moveX = joystick.dx;
            let moveY = joystick.dy;
            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            // Schwammige Trägheitssteuerung
            player.vx += (moveX * player.speed - player.vx) * 0.12;
            player.vy += (moveY * player.speed - player.vy) * 0.12;

            if (Math.abs(player.vx) > 0.01 || Math.abs(player.vy) > 0.01) {
                if (joystick.active && (moveX !== 0 || moveY !== 0)) {
                    player.angle = Math.atan2(moveY, moveX);
                }
                moveWithCollision(player, player.vx, player.vy);
            }

            player.x = Math.max(player.radius, Math.min(worldWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(worldHeight - player.radius, player.y));

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx; b.y += b.dy;
                if (b.x < 0 || b.x > worldWidth || b.y < 0 || b.y > worldHeight || checkCollisionWithObstacles(b.x, b.y, b.radius)) {
                    createParticles(b.x, b.y, b.color);
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.fromPlayer) {
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (Math.hypot(b.x - en.x, b.y - en.y) < b.radius + en.radius) {
                            en.hp -= 1; hit = true;
                            createParticles(en.x, en.y, "#ff3366");
                            addFloatText("-1 HP", en.x, en.y - 20, "#00f3ff");
                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                kills++;
                                document.getElementById("kill-count").innerText = kills;
                                if (enemies.length === 0) gameOver(true);
                            }
                            break;
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                } else {
                    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                        player.hp -= 1;
                        createParticles(player.x, player.y, "#00f3ff");
                        addFloatText("-1 HP", player.x, player.y - 20, "#ff3366");
                        bullets.splice(i, 1);
                        if (player.hp <= 0) gameOver(false);
                        continue;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                let distToPlayer = Math.hypot(player.x - en.x, player.y - en.y);
                let angleToTarget = Math.atan2(player.y - en.y, player.x - en.x);
                en.wanderAngle += (Math.random() - 0.5) * 0.5;

                let hasLOS = hasLineOfSight(en.x, en.y, player.x, player.y);
                let moveX = 0, moveY = 0;

                if (!hasLOS) {
                    let peekAngle = angleToTarget + (Math.PI / 2) * en.strafeDir;
                    moveX = Math.cos(peekAngle) * (en.speed * 0.9);
                    moveY = Math.sin(peekAngle) * (en.speed * 0.9);
                } else {
                    if (distToPlayer > en.preferredDist + 20) {
                        moveX = Math.cos(angleToTarget) * (en.speed * 0.8);
                        moveY = Math.sin(angleToTarget) * (en.speed * 0.8);
                    } else if (distToPlayer < en.preferredDist - 20) {
                        moveX = -Math.cos(angleToTarget) * (en.speed * 0.6);
                        moveY = -Math.sin(angleToTarget) * (en.speed * 0.6);
                    } else {
                        let strafeAngle = angleToTarget + (Math.PI / 2) * en.strafeDir;
                        moveX = Math.cos(strafeAngle) * (en.speed * 0.75);
                        moveY = Math.sin(strafeAngle) * (en.speed * 0.75);
                    }
                }

                moveWithCollision(en, moveX + Math.cos(en.wanderAngle) * 0.5, moveY + Math.sin(en.wanderAngle) * 0.5);
                en.x = Math.max(en.radius, Math.min(worldWidth - en.radius, en.x));
                en.y = Math.max(en.radius, Math.min(worldHeight - en.radius, en.y));

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = Math.random() * 60 + 30;
                    if (hasLOS) {
                        let shootAngle = angleToTarget + (Math.random() - 0.5) * 0.3;
                        bullets.push({
                            x: en.x, y: en.y,
                            dx: Math.cos(shootAngle) * en.classConfig.bulletSpeed,
                            dy: Math.sin(shootAngle) * en.classConfig.bulletSpeed,
                            radius: en.classConfig.bulletSize, color: "#ff9900",
                            fromPlayer: false, shooterIndex: i
                        });
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.y += ft.vy; ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function drawRoundedRect(targetCtx, x, y, w, h, r) {
            targetCtx.beginPath();
            targetCtx.moveTo(x + r, y);
            targetCtx.lineTo(x + w - r, y);
            targetCtx.quadraticCurveTo(x + w, y, x + w, y + r);
            targetCtx.lineTo(x + w, y + h - r);
            targetCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            targetCtx.lineTo(x + r, y + h);
            targetCtx.quadraticCurveTo(x, y + h, x, y + h - r);
            targetCtx.lineTo(x, y + r);
            targetCtx.quadraticCurveTo(x, y, x + r, y);
            targetCtx.closePath();
        }

        function draw() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 1;
            for (let x = 0; x <= worldWidth; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, worldHeight); ctx.stroke();
            }
            for (let y = 0; y <= worldHeight; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(worldWidth, y); ctx.stroke();
            }

            for (let obs of currentMap) {
                ctx.save();
                if (obs.type === 'water') {
                    ctx.shadowBlur = 15; ctx.shadowColor = "#00f3ff";
                    ctx.fillStyle = "rgba(14, 116, 144, 0.65)";
                    ctx.strokeStyle = "#00f3ff"; ctx.lineWidth = 3;
                    drawRoundedRect(ctx, obs.x, obs.y, obs.w, obs.h, obs.r || 20); ctx.fill(); ctx.stroke();
                } else {
                    ctx.shadowBlur = 12; ctx.shadowColor = "#3b82f6";
                    ctx.fillStyle = "#1e293b";
                    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 3;
                    drawRoundedRect(ctx, obs.x, obs.y, obs.w, obs.h, 8); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            }

            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, worldWidth, worldHeight);

            for (let en of enemies) {
                drawBlobWithAccessories(ctx, en.x, en.y, en.radius, Math.atan2(player.y - en.y, player.x - en.x), en.classConfig, en.color);
                drawHealthBar(en.x, en.y - en.radius - 12, en.hp, en.maxHp);
            }

            drawBlobWithAccessories(ctx, player.x, player.y, player.radius, player.angle, player.classConfig, skins[selectedSkin] ? skins[selectedSkin].color : "#00f3ff", true);
            drawHealthBar(player.x, player.y - player.radius - 12, player.hp, player.maxHp);

            for (let b of bullets) {
                ctx.save();
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            for (let p of particles) {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            for (let ft of floatTexts) {
                ctx.save();
                ctx.font = "bold 16px sans-serif"; ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha; ctx.shadowBlur = 4; ctx.shadowColor = "#000";
                ctx.fillText(ft.text, ft.x - 15, ft.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawBlobWithAccessories(targetCtx, x, y, radius, angle, cfg, baseColor, isPlayer = false) {
            targetCtx.save();

            if (isPlayer) {
                let endX = x + Math.cos(angle) * 170;
                let endY = y + Math.sin(angle) * 170;
                let grad = targetCtx.createLinearGradient(x, y, endX, endY);
                grad.addColorStop(0, "rgba(0, 243, 255, 0.9)");
                grad.addColorStop(0.6, "rgba(0, 243, 255, 0.3)");
                grad.addColorStop(1, "rgba(0, 243, 255, 0)");

                targetCtx.strokeStyle = grad;
                targetCtx.lineWidth = 3;
                targetCtx.shadowBlur = 12;
                targetCtx.shadowColor = "#00f3ff";
                targetCtx.beginPath();
                targetCtx.moveTo(x, y);
                targetCtx.lineTo(endX, endY);
                targetCtx.stroke();
            }

            if (cfg.id === 'tank') {
                targetCtx.shadowBlur = 15; targetCtx.shadowColor = "#1e293b";
                targetCtx.fillStyle = "#334155";
                targetCtx.beginPath(); targetCtx.arc(x, y, radius + 5, 0, Math.PI * 2); targetCtx.fill();
                targetCtx.strokeStyle = "#1e293b"; targetCtx.lineWidth = 3; targetCtx.stroke();
            } else if (cfg.id === 'agile') {
                targetCtx.strokeStyle = "#84cc16";
                targetCtx.lineWidth = 2.5;
                targetCtx.beginPath(); targetCtx.arc(x, y, radius + 3, 0, Math.PI * 2); targetCtx.stroke();
            }

            targetCtx.shadowBlur = 15; targetCtx.shadowColor = baseColor;
            targetCtx.fillStyle = baseColor;
            targetCtx.beginPath(); targetCtx.arc(x, y, radius, 0, Math.PI * 2); targetCtx.fill();

            targetCtx.fillStyle = "rgba(255,255,255,0.4)";
            targetCtx.beginPath(); targetCtx.arc(x - 5, y - 5, radius * 0.3, 0, Math.PI * 2); targetCtx.fill();

            if (cfg.id === 'tank') {
                targetCtx.fillStyle = "#94a3b8";
                targetCtx.fillRect(x - 6, y - radius - 2, 12, 4);
                targetCtx.fillRect(x - 6, y + radius - 2, 12, 4);
            } else if (cfg.id === 'agile') {
                targetCtx.fillStyle = "#22c55e";
                targetCtx.beginPath(); targetCtx.arc(x + Math.cos(angle) * 6, y + Math.sin(angle) * 6, 4, 0, Math.PI * 2); targetCtx.fill();
            } else if (cfg.id === 'shotgun') {
                targetCtx.strokeStyle = "#b45309"; targetCtx.lineWidth = 5;
                targetCtx.beginPath();
                targetCtx.moveTo(x - radius * 0.7, y - radius * 0.7);
                targetCtx.lineTo(x + radius * 0.7, y + radius * 0.7);
                targetCtx.stroke();
            } else if (cfg.id === 'sniper') {
                targetCtx.strokeStyle = "#eab308"; targetCtx.lineWidth = 3;
                targetCtx.beginPath();
                targetCtx.moveTo(x, y - radius);
                targetCtx.lineTo(x, y - radius - 8);
                targetCtx.stroke();
            }

            targetCtx.strokeStyle = cfg.id === 'tank' ? "#1e293b" : "#64748b";
            targetCtx.lineWidth = cfg.id === 'sniper' ? 3 : (cfg.id === 'shotgun' ? 6 : 4);
            let barrelLen = cfg.id === 'sniper' ? 34 : (cfg.id === 'shotgun' ? 22 : 26);
            
            targetCtx.beginPath();
            targetCtx.moveTo(x, y);
            targetCtx.lineTo(x + Math.cos(angle) * (radius + barrelLen), y + Math.sin(angle) * (radius + barrelLen));
            targetCtx.stroke();

            targetCtx.restore();
        }

        function drawHealthBar(x, y, current, max) {
            const barWidth = 40; const barHeight = 6;
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(x - barWidth / 2, y, barWidth, barHeight);
            ctx.fillStyle = current > 3 ? "#10b981" : "#ef4444";
            ctx.fillRect(x - barWidth / 2, y, (current / max) * barWidth, barHeight);
        }

        function gameLoop() {
            if (!gameRunning) return;
            if (!isPaused) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // Animierter Hintergrund & Vorschau im Hauptmenü
        let menuAnimTick = 0;
        function renderMenuBackground() {
            if (document.getElementById("start-screen").style.display !== "none") {
                mCtx.fillStyle = "#0f172a";
                mCtx.fillRect(0, 0, menuBgCanvas.width, menuBgCanvas.height);

                mCtx.strokeStyle = "#1e293b";
                mCtx.lineWidth = 1;
                for (let x = 0; x <= menuBgCanvas.width; x += 40) {
                    mCtx.beginPath(); mCtx.moveTo(x, 0); mCtx.lineTo(x, menuBgCanvas.height); mCtx.stroke();
                }
                for (let y = 0; y <= menuBgCanvas.height; y += 40) {
                    mCtx.beginPath(); mCtx.moveTo(0, y); mCtx.lineTo(menuBgCanvas.width, y); mCtx.stroke();
                }

                pCtx.clearRect(0, 0, 110, 110);
                pCtx.fillStyle = "rgba(15, 23, 42, 0.9)";
                pCtx.fillRect(0, 0, 110, 110);

                menuAnimTick += 0.04;
                let previewAngle = Math.sin(menuAnimTick) * 0.6;
                let currentClass = blobClasses[selectedClassIndex];
                let skinColor = skins[selectedSkin] ? skins[selectedSkin].color : "#00f3ff";

                drawBlobWithAccessories(pCtx, 55, 55, currentClass.radius * 1.3, previewAngle, currentClass, skinColor, false);
            }
            requestAnimationFrame(renderMenuBackground);
        }
        requestAnimationFrame(renderMenuBackground);
    </script>
</body>
