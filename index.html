<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Arena - Mobile Portrait</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 900px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #0f172a;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            z-index: 5;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 8px 16px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            padding: 30px;
        }
        #start-screen h1 {
            color: #00f3ff;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        #start-screen p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,243,255,0.4);
        }
        /* Mobile Touch Controls */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 5;
        }
        .control-pad {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
        }
        .control-knob {
            width: 44px;
            height: 44px;
            background: rgba(0, 243, 255, 0.7);
            border-radius: 50%;
            position: absolute;
            top: 26px;
            left: 26px;
            pointer-events: none;
            box-shadow: 0 0 12px #00f3ff;
        }
        #fire-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 51, 102, 0.3);
            border: 2px solid #ff3366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3366;
            font-weight: bold;
            font-size: 15px;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255,51,102,0.4);
        }
        #fire-btn:active {
            background: rgba(255, 51, 102, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div class="stat-box">HP: <span id="player-hp" style="color: #00f3ff;">10</span> / 10</div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <div id="start-screen">
            <h1>BLOB ARENA</h1>
            <p>Die Gegner kämpfen jetzt auch untereinander! Nutze den Joystick zum Bewegen und den Schuss-Button.</p>
            <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div id="joystick-pad" class="control-pad">
                <div id="joystick-knob" class="control-knob"></div>
            </div>
            <div id="fire-btn">SCHUSS</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth > 450 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight > 900 ? 900 : window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameRunning = false;
        let kills = 0;

        const worldWidth = 900;
        const worldHeight = 1200;

        let player = {
            x: worldWidth / 2,
            y: worldHeight / 2,
            radius: 20,
            hp: 10,
            maxHp: 10,
            speed: 4,
            color: "#00f3ff",
            angle: 0
        };

        let bullets = [];
        let enemies = [];
        let floatTexts = [];
        let particles = [];

        let joystick = {
            active: false,
            x: 0,
            y: 0,
            dx: 0,
            dy: 0,
            maxDist: 38
        };

        let keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        const pad = document.getElementById("joystick-pad");
        const knob = document.getElementById("joystick-knob");
        const fireBtn = document.getElementById("fire-btn");

        pad.addEventListener("touchstart", e => {
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            joystick.active = true;
        }, {passive: false});

        pad.addEventListener("touchmove", e => {
            e.preventDefault();
            if (joystick.active) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        pad.addEventListener("touchend", e => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        pad.addEventListener("mousedown", e => {
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.clientX, e.clientY);
            joystick.active = true;
        });
        window.addEventListener("mousemove", e => {
            if (joystick.active) updateJoystick(e.clientX, e.clientY);
        });
        window.addEventListener("mouseup", () => {
            if (joystick.active) resetJoystick();
        });

        function updateJoystick(clientX, clientY) {
            let pullX = clientX - joystick.x;
            let pullY = clientY - joystick.y;
            let dist = Math.hypot(pullX, pullY);

            if (dist > joystick.maxDist) {
                pullX = (pullX / dist) * joystick.maxDist;
                pullY = (pullY / dist) * joystick.maxDist;
            }

            knob.style.transform = `translate(${pullX}px, ${pullY}px)`;
            joystick.dx = pullX / joystick.maxDist;
            joystick.dy = pullY / joystick.maxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            knob.style.transform = `translate(0px, 0px)`;
        }

        fireBtn.addEventListener("touchstart", e => {
            e.preventDefault();
            shootPlayerBullet();
        }, {passive: false});
        fireBtn.addEventListener("mousedown", () => shootPlayerBullet());

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            player.x = worldWidth / 2;
            player.y = worldHeight / 2;
            player.hp = 10;
            kills = 0;
            bullets = [];
            enemies = [];
            floatTexts = [];
            particles = [];
            document.getElementById("player-hp").innerText = player.hp;
            document.getElementById("kill-count").innerText = kills;

            for (let i = 0; i < 4; i++) spawnEnemy();

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            let ex, ey;
            do {
                ex = Math.random() * (worldWidth - 80) + 40;
                ey = Math.random() * (worldHeight - 80) + 40;
            } while (Math.hypot(ex - player.x, ey - player.y) < 300);

            enemies.push({
                x: ex,
                y: ey,
                radius: 20,
                hp: 10,
                maxHp: 10,
                speed: 1.4 + Math.random() * 1.2,
                preferredDist: 80 + Math.random() * 100,
                shootCooldown: Math.random() * 80 + 40,
                wanderAngle: Math.random() * Math.PI * 2,
                color: "#ff3366"
            });
        }

        function shootPlayerBullet() {
            if (!gameRunning) return;
            let angle = player.angle;
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 8,
                dy: Math.sin(angle) * 8,
                radius: 6,
                color: "#00f3ff",
                fromPlayer: true,
                shooterIndex: -1
            });
        }

        function addFloatText(text, x, y, color = "#ff4444") {
            floatTexts.push({ text: text, x: x, y: y, alpha: 1.0, color: color, vy: -1.2 });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color, alpha: 1.0
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            let moveX = joystick.dx;
            let moveY = joystick.dy;

            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            if (moveX !== 0 || moveY !== 0) {
                player.x += moveX * player.speed;
