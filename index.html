<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blob Arena - PvE Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            border: 3px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }
        #start-screen h1 {
            color: #00f3ff;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        #start-screen p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 14px;
            max-width: 280px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,243,255,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0,243,255,0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div class="stat-box">HP: <span id="player-hp" style="color: #00f3ff;">10</span> / 10</div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <div id="start-screen">
            <h1>BLOB ARENA</h1>
            <p>Tritt in die Arena ein. Schieße auf rote Gegner-Blobs und überlebe mit deinen 10 HP!</p>
            <p style="font-size: 12px; color: #64748b;">Steuerung: WASD / Pfeile zum Bewegen<br>Maus zum Zielen & Klicken zum Schießen</p>
            <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameRunning = false;
        let kills = 0;

        // Welt-Größe (Größer als der Bildschirm für Arena-Feeling)
        const worldWidth = 1200;
        const worldHeight = 800;

        // Spieler-Objekt
        let player = {
            x: worldWidth / 2,
            y: worldHeight / 2,
            radius: 18,
            hp: 10,
            maxHp: 10,
            speed: 3.5,
            color: "#00f3ff",
            angle: 0
        };

        let keys = {};
        let mouse = { x: 0, y: 0, down: false };
        let bullets = [];
        let enemies = [];
        let floatTexts = [];
        let particles = [];

        // Event Listener für Steuerung
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", () => {
            if (!gameRunning) return;
            mouse.down = true;
            shootPlayerBullet();
        });
        canvas.addEventListener("mouseup", () => mouse.down = false);

        // Touch-Support für Mobile
        canvas.addEventListener("touchstart", e => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
            mouse.down = true;
            shootPlayerBullet();
            e.preventDefault();
        });
        canvas.addEventListener("touchmove", e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
            e.preventDefault();
        });
        canvas.addEventListener("touchend", () => mouse.down = false);

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            player.x = worldWidth / 2;
            player.y = worldHeight / 2;
            player.hp = 10;
            kills = 0;
            bullets = [];
            enemies = [];
            floatTexts = [];
            particles = [];
            document.getElementById("player-hp").innerText = player.hp;
            document.getElementById("kill-count").innerText = kills;

            // Start-Gegner spawnen
            for (let i = 0; i < 4; i++) {
                spawnEnemy();
            }

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            // Gegner außerhalb des direkten Sichtfelds spawnen
            let ex, ey;
            do {
                ex = Math.random() * (worldWidth - 100) + 50;
                ey = Math.random() * (worldHeight - 100) + 50;
            } while (Math.hypot(ex - player.x, ey - player.y) < 300);

            enemies.push({
                x: ex,
                y: ey,
                radius: 18,
                hp: 10,
                maxHp: 10,
                speed: 1.8 + Math.random() * 0.8,
                color: "#ff3366",
                shootCooldown: Math.random() * 80 + 40
            });
        }

        function shootPlayerBullet() {
            // Berechne Richtung zur Maus (relativ zum Bildschirm-Zentrum)
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;
            const angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);

            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 7,
                dy: Math.sin(angle) * 7,
                radius: 6,
                color: "#00f3ff",
                fromPlayer: true
            });
        }

        function addFloatText(text, x, y, color = "#ff4444") {
            floatTexts.push({
                text: text,
                x: x,
                y: y,
                alpha: 1.0,
                color: color,
                vy: -1.2
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1.0
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            // Spieler Bewegung (WASD / Pfeile)
            let moveX = 0;
            let moveY = 0;
            if (keys['w'] || keys['arrowup']) moveY -= 1;
            if (keys['s'] || keys['arrowdown']) moveY += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            player.x += moveX * player.speed;
            player.y += moveY * player.speed;

            // Begrenzung innerhalb der Welt
            player.x = Math.max(player.radius, Math.min(worldWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(worldHeight - player.radius, player.y));

            // Spieler Blickrichtung zur Maus
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;
            player.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);

            // Dauerfeuer wenn Maustaste gehalten wird
            if (mouse.down && Math.random() < 0.2) {
                shootPlayerBullet();
            }

            // Kugeln aktualisieren
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                // Welt-Ränder checken
                if (b.x < 0 || b.x > worldWidth || b.y < 0 || b.y > worldHeight) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Kollision mit Spielern / Gegnern
                if (b.fromPlayer) {
                    // Prüfen ob Gegner getroffen
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (Math.hypot(b.x - en.x, b.y - en.y) < b.radius + en.radius) {
                            en.hp -= 1;
                            hit = true;
                            createParticles(en.x, en.y, "#ff3366");
                            addFloatText("-1 HP", en.x, en.y - 20, "#00f3ff");

                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                kills++;
                                document.getElementById("kill-count").innerText = kills;
                                // Neuen Gegner nachspawnen
                                spawnEnemy();
                                spawnEnemy(); // Mit jedem Kill wird es etwas voller!
                            }
                            break;
                        }
                    }
                    if (hit) {
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    // Bot-Kugel trifft Spieler
                    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                        player.hp -= 1;
                        document.getElementById("player-hp").innerText = player.hp;
                        createParticles(player.x, player.y, "#00f3ff");
                        addFloatText("-1 HP", player.x, player.y - 20, "#ff3366");
                        bullets.splice(i, 1);

                        if (player.hp <= 0) {
                            gameRunning = false;
                            document.getElementById("start-screen").style.display = "flex";
                            document.getElementById("start-screen").querySelector("h1").innerText = "GAME OVER";
                            document.getElementById("start-screen").querySelector("p").innerText = `Du hast ${kills} Gegner besiegt! Versuche es noch einmal.`;
                            document.getElementById("start-screen").querySelector(".btn").innerText = "NEU STARTEN";
                        }
                        continue;
                    }
                }
            }

            // Gegner KI & Verhalten
            for (let en of enemies) {
                let distToPlayer = Math.hypot(player.x - en.x, player.y - en.y);

                // Verfolge den Spieler aus der Distanz
                if (distToPlayer > 120) {
                    let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
                    en.x += Math.cos(angleToPlayer) * en.speed;
                    en.y += Math.sin(angleToPlayer) * en.speed;
                } else if (distToPlayer < 80) {
                    // Etwas Abstand halten wenn zu nah
                    let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
                    en.x -= Math.cos(angleToPlayer) * (en.speed * 0.5);
                    en.y -= Math.sin(angleToPlayer) * (en.speed * 0.5);
                }

                // Auf den Spieler schießen
                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = Math.random() * 70 + 50; // Schuss-Intervall
                    let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
                    // Etwas Ungenauigkeit einbauen, damit es fair bleibt
                    angleToPlayer += (Math.random() - 0.5) * 0.4;

                    bullets.push({
                        x: en.x,
                        y: en.y,
                        dx: Math.cos(angleToPlayer) * 4.5,
                        dy: Math.sin(angleToPlayer) * 4.5,
                        radius: 6,
                        color: "#ff9900",
                        fromPlayer: false
                    });
                }
            }

            // Partikel aktualisieren
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Schwebende Texte aktualisieren
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function draw() {
            // Canvas leeren
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Kamera-Verschiebung (Spieler zentrieren)
            ctx.save();
            let camX = canvas.width / 2 - player.x;
            let camY = canvas.height / 2 - player.y;
            ctx.translate(camX, camY);

            // Arena-Gitter zeichnen für Tiefe
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x <= worldWidth; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, worldHeight);
                ctx.stroke();
            }
            for (let y = 0; y <= worldHeight; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(worldWidth, y);
                ctx.stroke();
            }

            // Arena-Begrenzungswand
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, worldWidth, worldHeight);

            // Gegner zeichnen
            for (let en of enemies) {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = en.color;
                ctx.fillStyle = en.color;
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Kleiner innerer Glanz für Blob-Look
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.beginPath();
                ctx.arc(en.x - 5, en.y - 5, 5, 0, Math.PI * 2);
                ctx.fill();

                // Mini-Lebensbalken über dem Gegner
                drawHealthBar(en.x, en.y - en.radius - 10, en.hp, en.maxHp);
            }

            // Spieler zeichnen
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Spieler Glanz
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath();
            ctx.arc(player.x - 6, player.y - 6, 6, 0, Math.PI * 2);
            ctx.fill();

            // Spieler Kanone / Blickrichtung anzeigen
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(player.angle) * 22, player.y + Math.sin(player.angle) * 22);
            ctx.stroke();

            // Kugeln zeichnen
            for (let b of bullets) {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Partikel zeichnen
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // Schwebende Schadenszahlen zeichnen
            for (let ft of floatTexts) {
                ctx.save();
                ctx.font = "bold 16px sans-serif";
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#000";
                ctx.fillText(ft.text, ft.x - 15, ft.y);
                ctx.restore();
            }

            ctx.restore(); // Kamera-Transform zurücksetzen
        }

        function drawHealthBar(x, y, current, max) {
            const barWidth = 36;
            const barHeight = 5;
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(x - barWidth / 2, y, barWidth, barHeight);

            const healthWidth = (current / max) * barWidth;
            ctx.fillStyle = current > 3 ? "#10b981" : "#ef4444";
            ctx.fillRect(x - barWidth / 2, y, healthWidth, barHeight);
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
          </html>
