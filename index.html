<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Arena - Smooth Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 900px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: #0f172a;
            width: 100%;
            height: 100%;
        }
        /* Fade-Overlay für weiche Szenen-Übergänge */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            z-index: 50;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            z-index: 5;
            display: none;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 8px 14px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            color: #00f3ff;
            font-size: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 20;
            padding: 30px 20px;
            cursor: default;
        }
        .screen h1 {
            color: #00f3ff;
            font-size: 30px;
            margin: 5px 0;
            text-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        .menu-top {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .class-selector-box {
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #334155;
            border-radius: 18px;
            padding: 12px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        .class-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }
        .arrow-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .arrow-btn:active {
            transform: scale(0.9);
            background: #00f3ff;
            color: #000;
        }
        .preview-container {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .class-info {
            width: 100%;
            text-align: center;
            margin-top: 8px;
        }
        .class-info h3 {
            margin: 0 0 3px 0;
            color: #f8fafc;
            font-size: 17px;
        }
        .class-info p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.3;
        }
        .menu-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(0,243,255,0.4);
            pointer-events: auto;
            width: 260px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 200px;
            padding: 11px 22px;
            font-size: 14px;
        }
        .end-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .icon-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        #retry-btn { background: #10b981; color: #fff; }
        #home-btn { background: #6366f1; color: #fff; }
        #shop-screen { display: none; justify-content: flex-start; }
        .shop-list {
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding-right: 5px;
        }
        .shop-item {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #f8fafc; text-align: left; }
        .shop-info p { margin: 0; font-size: 12px; color: #94a3b8; text-align: left; }
        .buy-btn {
            background: #f59e0b; color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .buy-btn.equipped { background: #10b981; color: #fff; }
        .buy-btn.locked { background: #3b82f6; color: #fff; }
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 5;
            display: none;
        }
        .control-pad {
            width: 100px; height: 100px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; pointer-events: auto;
        }
        .control-knob {
            width: 44px; height: 44px; background: rgba(0, 243, 255, 0.7); border-radius: 50%; position: absolute; top: 26px; left: 26px; pointer-events: none; box-shadow: 0 0 12px #00f3ff;
        }
        #fire-btn {
            width: 90px; height: 90px; background: rgba(255, 51, 102, 0.3); border: 2px solid #ff3366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ff3366; font-weight: bold; font-size: 15px; pointer-events: auto; box-shadow: 0 0 15px rgba(255,51,102,0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Fade Overlay für sanfte Übergänge -->
        <div id="fade-overlay"></div>

        <div id="ui-overlay">
            <div class="stat-box">Spieler übrig: <span id="remaining-players" style="color: #00f3ff;">0</span></div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <button id="pause-btn" onclick="togglePause()">⏸</button>

        <!-- Hauptmenü -->
        <div id="start-screen" class="screen">
            <div class="menu-top">
                <h1>BLOB ARENA</h1>
                
                <div class="class-selector-box">
                    <div class="class-header">
                        <button class="arrow-btn" onclick="changeClass(-1)">◀</button>
                        <div class="preview-container">
                            <canvas id="menuPreviewCanvas" width="100" height="100"></canvas>
                        </div>
                        <button class="arrow-btn" onclick="changeClass(1)">▶</button>
                    </div>
                    <div class="class-info">
                        <h3 id="menu-class-name">Standard Blob</h3>
                        <p id="menu-class-desc">Ausgewogener Allrounder.</p>
                        <p id="menu-class-status" style="margin-top: 5px; font-weight: bold; color: #10b981;"></p>
                    </div>
                </div>
            </div>

            <div class="menu-bottom">
                <div style="font-size: 13px; color: #94a3b8; margin-bottom: -3px;">
                    Level <span id="player-level" style="color: #00f3ff; font-weight: bold;">1</span> | XP: <span id="player-xp">0</span> / <span id="player-next-xp">500</span> | Coins: <span id="menu-coins" style="color: #f59e0b; font-weight: bold;">0</span> 🪙
                </div>
                <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
                <button class="btn btn-secondary" onclick="openShop()">SKIN SHOP</button>
            </div>
        </div>

        <!-- Shop Menü -->
        <div id="shop-screen" class="screen" style="display: none;">
            <div class="menu-top" style="width: 100%;">
                <h1>SKIN SHOP</h1>
                <p>Deine Coins: <span id="shop-coins-display" style="color: #f59e0b; font-weight: bold;">0</span> 🪙</p>
                <div class="shop-list" id="shop-items-container"></div>
            </div>
            <div class="menu-bottom">
                <button class="btn btn-secondary" onclick="closeShop()">ZURÜCK</button>
            </div>
        </div>

        <!-- Pause Menü -->
        <div id="pause-screen" class="screen" style="display: none; justify-content: center;">
            <h1>PAUSE</h1>
            <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%;">
                <button class="btn" onclick="resumeGame()">Weiter spielen</button>
                <button class="btn btn-secondary" onclick="startGame()">Erneut Versuchen</button>
                <button class="btn btn-secondary" onclick="openOptions()">Optionen</button>
                <button class="btn btn-secondary" onclick="goHome()">Hauptmenü</button>
            </div>
        </div>

        <!-- End-Screen -->
        <div id="end-screen" class="screen" style="display: none; justify-content: center;">
            <h1 id="end-title">GAME OVER</h1>
            <p id="end-message" style="font-size: 16px; margin: 10px 0;">Du wurdest besiegt!</p>
            <div class="end-buttons">
                <button class="icon-btn" id="retry-btn" onclick="startGame()" title="Retry">↺</button>
                <button class="icon-btn" id="home-btn" onclick="goHome()" title="Home">⌂</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div id="joystick-pad" class="control-pad">
                <div id="joystick-knob" class="control-knob"></div>
            </div>
            <div id="fire-btn">SCHUSS</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const previewCanvas = document.getElementById("menuPreviewCanvas");
        const pCtx = previewCanvas.getContext("2d");
        const fadeOverlay = document.getElementById("fade-overlay");

        function resizeCanvas() {
            canvas.width = window.innerWidth > 450 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight > 900 ? 900 : window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let coins = parseInt(localStorage.getItem('blob_coins')) || 0;
        let totalXP = parseInt(localStorage.getItem('blob_xp')) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem('blob_unlocked_skins')) || ['default'];
        let selectedSkin = localStorage.getItem('blob_selected_skin') || 'default';

        const blobClasses = [
            { id: 'standard', name: "Standard Blob", level: 1, radius: 20, speed: 4, hp: 10, fireRate: 35, bulletSpeed: 12, bulletSize: 6, desc: "Ausgewogener Allrounder mit Standard-Gewehr." },
            { id: 'agile', name: "Agile MP", level: 2, radius: 17, speed: 5.5, hp: 7, fireRate: 12, bulletSpeed: 15, bulletSize: 4, desc: "Extrem schnell, feuert rasante MP-Salven." },
            { id: 'shotgun', name: "Shotgunner", level: 3, radius: 21, speed: 3.8, hp: 12, fireRate: 50, bulletSpeed: 11, bulletSize: 6, desc: "Nahkampf-Spezialist mit Schrotflinten-Salve." },
            { id: 'sniper', name: "Sniper Blob", level: 4, radius: 18, speed: 3.5, hp: 8, fireRate: 75, bulletSpeed: 20, bulletSize: 8, desc: "Hält großen Abstand und feuert Sniper-Kugeln." },
            { id: 'tank', name: "Heavy Tank", level: 5, radius: 26, speed: 2.8, hp: 20, fireRate: 65, bulletSpeed: 10, bulletSize: 11, desc: "Massiv gepanzert, langsam, schwere Artillerie." }
        ];

        let selectedClassIndex = parseInt(localStorage.getItem('blob_selected_class')) || 0;

        function getLevel(xp) {
            let lvl = 1;
            while (xp >= getXpForNextLevel(lvl)) {
                lvl++;
            }
            return lvl;
        }

        function getXpForNextLevel(lvl) {
            return Math.floor(500 * Math.pow(lvl, 2.0));
        }

        function updateMenuDisplay() {
            let currentLevel = getLevel(totalXP);
            let nextXpReq = getXpForNextLevel(currentLevel);
            let prevXpReq = currentLevel > 1 ? getXpForNextLevel(currentLevel - 1) : 0;
            
            document.getElementById("player-level").innerText = currentLevel;
            document.getElementById("player-xp").innerText = totalXP - prevXpReq;
            document.getElementById("player-next-xp").innerText = nextXpReq - prevXpReq;
            document.getElementById("menu-coins").innerText = coins;
            document.getElementById("shop-coins-display").innerText = coins;

            let cClass = blobClasses[selectedClassIndex];
            document.getElementById("menu-class-name").innerText = cClass.name;
            document.getElementById("menu-class-desc").innerText = cClass.desc;

            let statusEl = document.getElementById("menu-class-status");
            if (currentLevel >= cClass.level) {
                statusEl.innerText = "✓ FREIGESCHALTET";
                statusEl.style.color = "#10b981";
            } else {
                statusEl.innerText = `🔒 Benötigt Level ${cClass.level}`;
                statusEl.style.color = "#ef4444";
            }
        }
        updateMenuDisplay();

        function changeClass(dir) {
            selectedClassIndex = (selectedClassIndex + dir + blobClasses.length) % blobClasses.length;
            localStorage.setItem('blob_selected_class', selectedClassIndex);
            updateMenuDisplay();
        }
