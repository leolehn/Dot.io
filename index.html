<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blob Arena - Mobile Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 540px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            border: 3px solid #1f293d;
            border-radius: 16px;
            overflow: hidden;
            background: #0f172a;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            z-index: 5;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            padding: 20px;
            box-sizing: border-box;
        }
        #start-screen h1 {
            color: #00f3ff;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        #start-screen p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,243,255,0.4);
        }
        /* Mobile Touch Controls UI */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 5;
        }
        .control-pad {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        .control-knob {
            width: 40px;
            height: 40px;
            background: rgba(0, 243, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: 25px;
            pointer-events: none;
            box-shadow: 0 0 10px #00f3ff;
        }
        #fire-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 51, 102, 0.3);
            border: 2px solid #ff3366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3366;
            font-weight: bold;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 0 10px rgba(255,51,102,0.4);
            touch-action: none;
        }
        #fire-btn:active {
            background: rgba(255, 51, 102, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div class="stat-box">HP: <span id="player-hp" style="color: #00f3ff;">10</span> / 10</div>
            <div class="stat-box">Kills: <span id="kill-count" style="color: #10b981;">0</span></div>
        </div>

        <div id="start-screen">
            <h1>BLOB ARENA</h1>
            <p>Weiche den roten Blobs aus, nutze den linken Joystick zum Bewegen und den rechten Button zum Schießen!</p>
            <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
        </div>

        <canvas id="gameCanvas" width="360" height="540"></canvas>

        <div id="mobile-controls">
            <div id="joystick-pad" class="control-pad">
                <div id="joystick-knob" class="control-knob"></div>
            </div>
            <div id="fire-btn">SCHUSS</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameRunning = false;
        let kills = 0;

        // Welt-Größe (Größer als der Bildschirm für Arena-Scrolling)
        const worldWidth = 800;
        const worldHeight = 1000;

        let player = {
            x: worldWidth / 2,
            y: worldHeight / 2,
            radius: 18,
            hp: 10,
            maxHp: 10,
            speed: 3.5,
            color: "#00f3ff",
            angle: 0
        };

        let bullets = [];
        let enemies = [];
        let floatTexts = [];
        let particles = [];

        // Joystick Variablen
        let joystick = {
            active: false,
            x: 0,
            y: 0,
            dx: 0,
            dy: 0,
            maxDist: 35
        };

        // Tastatur-Fallback für PC
        let keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Touch / Joystick Setup
        const pad = document.getElementById("joystick-pad");
        const knob = document.getElementById("joystick-knob");
        const fireBtn = document.getElementById("fire-btn");

        pad.addEventListener("touchstart", handleTouchStart, {passive: false});
        pad.addEventListener("touchmove", handleTouchMove, {passive: false});
        pad.addEventListener("touchend", handleTouchEnd, {passive: false});

        // Auch mit Maus bedienbar für Tests am PC
        pad.addEventListener("mousedown", handleMouseDown);
        window.addEventListener("mousemove", handleMouseMove);
        window.addEventListener("mouseup", handleMouseUp);

        let isMouseJoystick = false;

        function handleTouchStart(e) {
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            joystick.active = true;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (joystick.active) {
                updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            resetJoystick();
        }

        function handleMouseDown(e) {
            const rect = pad.getBoundingClientRect();
            joystick.x = rect.left + rect.width / 2;
            joystick.y = rect.top + rect.height / 2;
            updateJoystick(e.clientX, e.clientY);
            joystick.active = true;
            isMouseJoystick = true;
        }

        function handleMouseMove(e) {
            if (joystick.active && isMouseJoystick) {
                updateJoystick(e.clientX, e.clientY);
            }
        }

        function handleMouseUp() {
            if (isMouseJoystick) {
                resetJoystick();
                isMouseJoystick = false;
            }
        }

        function updateJoystick(clientX, clientY) {
            let pullX = clientX - joystick.x;
            let pullY = clientY - joystick.y;
            let dist = Math.hypot(pullX, pullY);

            if (dist > joystick.maxDist) {
                pullX = (pullX / dist) * joystick.maxDist;
                pullY = (pullY / dist) * joystick.maxDist;
            }

            knob.style.transform = `translate(${pullX}px, ${pullY}px)`;
            
            // Normierte Richtung für Bewegung (-1 bis 1)
            joystick.dx = pullX / joystick.maxDist;
            joystick.dy = pullY / joystick.maxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            knob.style.transform = `translate(0px, 0px)`;
        }

        // Schuss-Button Event
        fireBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            shootPlayerBullet();
        });
        fireBtn.addEventListener("mousedown", (e) => {
            shootPlayerBullet();
        });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            player.x = worldWidth / 2;
            player.y = worldHeight / 2;
            player.hp = 10;
            kills = 0;
            bullets = [];
            enemies = [];
            floatTexts = [];
            particles = [];
            document.getElementById("player-hp").innerText = player.hp;
            document.getElementById("kill-count").innerText = kills;

            for (let i = 0; i < 4; i++) {
                spawnEnemy();
            }

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            let ex, ey;
            do {
                ex = Math.random() * (worldWidth - 60) + 30;
                ey = Math.random() * (worldHeight - 60) + 30;
            } while (Math.hypot(ex - player.x, ey - player.y) < 250);

            enemies.push({
                x: ex,
                y: ey,
                radius: 18,
                hp: 10,
                maxHp: 10,
                speed: 1.6 + Math.random() * 0.6,
                color: "#ff3366",
                shootCooldown: Math.random() * 80 + 40
            });
        }

        function shootPlayerBullet() {
            if (!gameRunning) return;
            // Schieße in Blickrichtung oder nach vorne, wenn unbewegt
            let angle = player.angle;
            
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 7,
                dy: Math.sin(angle) * 7,
                radius: 6,
                color: "#00f3ff",
                fromPlayer: true
            });
        }

        function addFloatText(text, x, y, color = "#ff4444") {
            floatTexts.push({ text: text, x: x, y: y, alpha: 1.0, color: color, vy: -1.2 });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color, alpha: 1.0
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            // Bewegung per Joystick oder WASD
            let moveX = joystick.dx;
            let moveY = joystick.dy;

            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            if (moveX !== 0 || moveY !== 0) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;
                // Blickrichtung anpassen
                player.angle = Math.atan2(moveY, moveX);
            }

            player.x = Math.max(player.radius, Math.min(worldWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(worldHeight - player.radius, player.y));

            // Kugeln aktualisieren
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.x < 0 || b.x > worldWidth || b.y < 0 || b.y > worldHeight) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.fromPlayer) {
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (Math.hypot(b.x - en.x, b.y - en.y) < b.radius + en.radius) {
                            en.hp -= 1;
                            hit = true;
                            createParticles(en.x, en.y, "#ff3366");
                            addFloatText("-1 HP", en.x, en.y - 20, "#00f3ff");

                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                kills++;
                                document.getElementById("kill-count").innerText = kills;
                                spawnEnemy();
                                spawnEnemy();
                            }
                            break;
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                } else {
                    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                        player.hp -= 1;
                        document.getElementById("player-hp").innerText = player.hp;
                        createParticles(player.x, player.y, "#00f3ff");
                        addFloatText("-1 HP", player.x, player.y - 20, "#ff3366");
                        bullets.splice(i, 1);

                        if (player.hp <= 0) {
                            gameRunning = false;
                            document.getElementById("start-screen").style.display = "flex";
                            document.getElementById("start-screen").querySelector("h1").innerText = "GAME OVER";
                            document.getElementById("start-screen").querySelector("p").innerText = `Du hast ${kills} Gegner besiegt!`;
                            document.getElementById("start-screen").querySelector(".btn").innerText = "NOCHMAL";
                        }
                        continue;
                    }
                }
            }

            // Gegner Logik
            for (let en of enemies) {
                let distToPlayer = Math.hypot(player.x - en.x, player.y - en.y);
                let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);

                if (distToPlayer > 100) {
                    en.x += Math.cos(angleToPlayer) * en.speed;
                    en.y += Math.sin(angleToPlayer) * en.speed;
                }

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = Math.random() * 80 + 50;
                    let shootAngle = angleToPlayer + (Math.random() - 0.5) * 0.4;
                    bullets.push({
                        x: en.x, y: en.y,
                        dx: Math.cos(shootAngle) * 4.5,
                        dy: Math.sin(shootAngle) * 4.5,
                        radius: 6,
                        color: "#ff9900",
                        fromPlayer: false
                    });
                }
            }

            // Partikel & Schadensanzeige
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.y += ft.vy; ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let camX = canvas.width / 2 - player.x;
            let camY = canvas.height / 2 - player.y;
            ctx.translate(camX, camY);

            // Gitter
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x <= worldWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, worldHeight); ctx.stroke();
            }
            for (let y = 0; y <= worldHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(worldWidth, y); ctx.stroke();
            }

            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, worldWidth, worldHeight);

            // Gegner
            for (let en of enemies) {
                ctx.save();
                ctx.shadowBlur = 12; ctx.shadowColor = en.color;
                ctx.fillStyle = en.color;
                ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.beginPath(); ctx.arc(en.x - 5, en.y - 5, 5, 0, Math.PI * 2); ctx.fill();
                drawHealthBar(en.x, en.y - en.radius - 10, en.hp, en.maxHp);
            }

            // Spieler
            ctx.save();
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.arc(player.x - 6, player.y - 6, 6, 0, Math.PI * 2); ctx.fill();

            // Geschütz-Stab
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(player.angle) * 22, player.y + Math.sin(player.angle) * 22);
            ctx.stroke();

            // Kugeln
            for (let b of bullets) {
                ctx.save();
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // Partikel
            for (let p of particles) {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // Schadens-Texte
            for (let ft of floatTexts) {
                ctx.save();
                ctx.font = "bold 15px sans-serif"; ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha; ctx.shadowBlur = 4; ctx.shadowColor = "#000";
                ctx.fillText(ft.text, ft.x - 15, ft.y);
